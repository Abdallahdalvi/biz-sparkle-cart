version: "3.8"

services:
  techlab-storefront:
    image: ghcr.io/abdallahdalvi/biz-sparkle-cart:latest
    container_name: techlab-storefront
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      - PORT=9999
      - NODE_ENV=production
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - BUSINESS_TRACKER_ENCRYPTION_KEY=${BUSINESS_TRACKER_ENCRYPTION_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - SHIPROCKET_EMAIL=${SHIPROCKET_EMAIL:-}
      - SHIPROCKET_PASSWORD=${SHIPROCKET_PASSWORD:-}
      - SHIPROCKET_PICKUP_LOCATION=${SHIPROCKET_PICKUP_LOCATION:-Primary}
    network_mode: bridge
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Optional Watchtower service to automatically update CasaOS container when new images are pushed to GitHub Container Registry
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 techlab-storefront
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=false
